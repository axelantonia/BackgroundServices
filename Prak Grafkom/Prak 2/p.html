<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5D Quantum Hyper-Core Experience</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #030308;
        }

        #mycanvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00f0ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 13px;
            letter-spacing: 2px;
            pointer-events: none;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.7);
        }

        .title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 5px;
            color: #ffffff;
        }
    </style>

    <!-- Import Engine Visual 3D Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-overlay">
        <div class="title">Quantum Hyper-Core 5D</div>
        <div>Status: Hyper-Dimensional Morphing Active</div>
        <div>Controls: Drag (Orbit) | Scroll (Zoom) | Move Mouse (Quantum Shift)</div>
    </div>

    <canvas id="mycanvas"></canvas>

    <script>
        /**
         * PROFESSIONAL WEBGL GRAPHICS ARCHITECTURE
         * Concept: 4D/5D Projection Morphing Energy Core with Quantum Particles
         */
        window.addEventListener('load', () => {
            const canvas = document.getElementById('mycanvas');

            // 1. SCENE SETUP
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030308, 0.035);

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 8;

            const renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                antialias: true,
                alpha: false,
                powerPreference: "high-performance"
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;

            // 2. CUSTOM PROCEDURAL SHADER (Organic Morphing Core)
            const coreVertexShader = `
                uniform float uTime;
                uniform float uDisplacement;
                varying vec3 vNormal;
                varying vec3 vPos;
                varying float vNoise;

                // Simplex-Noise Function for Organic Morphing
                vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
                vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

                float snoise(vec3 v) {
                    const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                    const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                    vec3 i  = floor(v + dot(v, C.yyy));
                    vec3 x0 = v - i + dot(i, C.xxx);
                    vec3 g = step(x0.yzx, x0.xyz);
                    vec3 l = 1.0 - g;
                    vec3 i1 = min(g.xyz, l.zxy);
                    vec3 i2 = max(g.xyz, l.zxy);
                    vec3 x1 = x0 - i1 + C.xxx;
                    vec3 x2 = x0 - i2 + C.yyy;
                    vec3 x3 = x0 - D.yyy;
                    i = mod289(i);
                    vec4 p = permute(permute(permute(
                                i.z + vec4(0.0, i1.z, i2.z, 1.0))
                            + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                            + i.x + vec4(0.0, i1.x, i2.x, 1.0));
                    float n_ = 0.142857142857;
                    vec3 ns = n_ * D.wyz - D.xzx;
                    vec4 j = p - 49.0 * floor(p * (1.0 / 49.0));
                    vec4 x_ = floor(j * ns.z);
                    vec4 y_ = floor(j - 7.0 * x_;
                    vec4 x = x_ *ns.x + ns.yyyy;
                    vec4 y = y_ *ns.x + ns.yyyy;
                    vec4 h = 1.0 - abs(x) - abs(y);
                    vec4 b0 = vec4(x.xy, y.xy);
                    vec4 b1 = vec4(x.zw, y.zw);
                    vec4 s0 = floor(b0)*2.0 + 1.0;
                    vec4 s1 = floor(b1)*2.0 + 1.0;
                    vec4 sh = -step(h, vec4(0.0));
                    vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
                    vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
                    vec3 p0 = vec3(a0.xy, h.x);
                    vec3 p1 = vec3(a0.zw, h.y);
                    vec3 p2 = vec3(a1.xy, h.z);
                    vec3 p3 = vec3(a1.zw, h.w);
                    vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                    p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                    vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                    m = m * m;
                    return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
                }

                void main() {
                    vNormal = normal;
                    vPos = position;
                    
                    // Wave Pulse & Distortion Equations (Simulation 4D to 3D folding)
                    float noise = snoise(position * 1.5 + vec3(uTime * 0.4));
                    vNoise = noise;
                    
                    vec3 newPosition = position + normal * (noise * uDisplacement);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
                }
            `;

            const coreFragmentShader = `
                uniform float uTime;
                varying vec3 vNormal;
                varying vec3 vPos;
                varying float vNoise;

                void main() {
                    vec3 normal = normalize(vNormal);
                    
                    // Dynamic Chromatic Color Shifts
                    vec3 colorA = vec3(0.0, 0.8, 1.0); // Cyan Energy
                    vec3 colorB = vec3(1.0, 0.0, 0.6); // Magenta Pulse
                    vec3 colorC = vec3(1.0, 0.8, 0.0); // Gold Core

                    float mixFactor = sin(vPos.x * 2.0 + uTime) * 0.5 + 0.5;
                    vec3 finalColor = mix(colorA, colorB, mixFactor + vNoise * 0.3);
                    finalColor = mix(finalColor, colorC, clamp(vNoise, 0.0, 1.0));

                    // Fresnel Rim Lighting Effect
                    vec3 viewDir = vec3(0.0, 0.0, 1.0);
                    float fresnel = pow(1.0 - max(dot(normal, viewDir), 0.0), 3.0);

                    gl_FragColor = vec4(finalColor + vec3(fresnel * 0.8), 0.85);
                }
            `;

            // 3. CORE OBJECT CREATION (Morphing Core)
            const coreGeometry = new THREE.IcosahedronGeometry(2, 64);
            const coreMaterial = new THREE.ShaderMaterial({
                vertexShader: coreVertexShader,
                fragmentShader: coreFragmentShader,
                uniforms: {
                    uTime: { value: 0.0 },
                    uDisplacement: { value: 0.45 }
                },
                transparent: true,
                wireframe: false
            });

            const hyperCore = new THREE.Mesh(coreGeometry, coreMaterial);
            scene.add(hyperCore);

            // 4. OUTER HYPER-DIMENSIONAL WIREFRAME (Tesseract Overlay)
            const wireGeometry = new THREE.TorusKnotGeometry(2.8, 0.6, 120, 16);
            const wireMaterial = new THREE.MeshBasicMaterial({
                color: 0x00f0ff,
                wireframe: true,
                transparent: true,
                opacity: 0.25
            });
            const outerCage = new THREE.Mesh(wireGeometry, wireMaterial);
            scene.add(outerCage);

            // 5. QUANTUM PARTICLE FIELD (5D Dust Particles)
            const particleCount = 2500;
            const particleGeo = new THREE.BufferGeometry();
            const particlePositions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount * 3; i += 3) {
                particlePositions[i] = (Math.random() - 0.5) * 25;
                particlePositions[i + 1] = (Math.random() - 0.5) * 25;
                particlePositions[i + 2] = (Math.random() - 0.5) * 25;
            }

            particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));

            const particleMat = new THREE.PointsMaterial({
                size: 0.04,
                color: 0xffffff,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });

            const particleSystem = new THREE.Points(particleGeo, particleMat);
            scene.add(particleSystem);

            // 6. DYNAMIC LIGHTING SYSTEM
            const pLight1 = new THREE.PointLight(0x00f0ff, 3, 20);
            const pLight2 = new THREE.PointLight(0xff0077, 3, 20);
            scene.add(pLight1, pLight2);
            scene.add(new THREE.AmbientLight(0x111122));

            // 7. INTERACTION & CONTROLS
            let mouseX = 0, mouseY = 0;
            let targetX = 0, targetY = 0;

            document.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX - window.innerWidth / 2) * 0.0015;
                mouseY = (e.clientY - window.innerHeight / 2) * 0.0015;
            });

            let isDragging = false, prevMouseX = 0, prevMouseY = 0;
            canvas.addEventListener('mousedown', (e) => { isDragging = true; prevMouseX = e.clientX; prevMouseY = e.clientY; });
            window.addEventListener('mouseup', () => isDragging = false);
            canvas.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const deltaX = e.clientX - prevMouseX;
                    const deltaY = e.clientY - prevMouseY;
                    hyperCore.rotation.y += deltaX * 0.005;
                    hyperCore.rotation.x += deltaY * 0.005;
                    prevMouseX = e.clientX;
                    prevMouseY = e.clientY;
                }
            });

            canvas.addEventListener('wheel', (e) => {
                camera.position.z += e.deltaY * 0.005;
                camera.position.z = Math.min(Math.max(camera.position.z, 3.5), 18.0);
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // 8. RENDER LOOP (Animasi 5D & Physics Simulation)
            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);

                const elapsedTime = clock.getElapsedTime();

                // Update Uniforms Shader (Morphing & Pulsing)
                coreMaterial.uniforms.uTime.value = elapsedTime;
                coreMaterial.uniforms.uDisplacement.value = 0.35 + Math.sin(elapsedTime * 2.0) * 0.15;

                // Rotasi Multi-Aksis (Simulasi Dimensi Tinggi)
                if (!isDragging) {
                    hyperCore.rotation.y = elapsedTime * 0.2;
                    hyperCore.rotation.x = Math.sin(elapsedTime * 0.3) * 0.5;
                }

                outerCage.rotation.x = -elapsedTime * 0.15;
                outerCage.rotation.z = elapsedTime * 0.25;

                // Pergerakan Partikel
                particleSystem.rotation.y = elapsedTime * 0.03;

                // Animasi Sumber Cahaya Mengorbit Core
                pLight1.position.x = Math.sin(elapsedTime * 1.5) * 4;
                pLight1.position.z = Math.cos(elapsedTime * 1.5) * 4;
                pLight2.position.y = Math.cos(elapsedTime * 1.2) * 4;
                pLight2.position.z = Math.sin(elapsedTime * 1.2) * 4;

                // Smooth Parallax Camera dari Gerakan Kursor Mouse
                targetX += (mouseX - targetX) * 0.05;
                targetY += (mouseY - targetY) * 0.05;
                camera.position.x = targetX * 4;
                camera.position.y = -targetY * 4;
                camera.lookAt(scene.position);

                renderer.render(scene, camera);
            }

            animate();
        });
    </script>
</body>
</html>
